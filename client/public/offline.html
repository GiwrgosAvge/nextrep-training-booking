<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <title>Χωρίς σύνδεση | NextRep</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        color: #202722;
        background: #f6f5f1;
      }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        place-items: center;
        text-align: center;
      }
      main {
        width: min(100%, 360px);
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 24px;
      }
      p {
        color: #6f7771;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #edf1eb;
          background: #151b17;
        }
        p {
          color: #a8b2a9;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="" />
      <h1>Δεν υπάρχει σύνδεση</h1>
      <p>Συνδέσου στο διαδίκτυο για να δεις το πρόγραμμα και τα ραντεβού σου. Για την προστασία σου, τα προσωπικά δεδομένα δεν αποθηκεύονται στη συσκευή.</p>
    </main>
  </body>
</html>
